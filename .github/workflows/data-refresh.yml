name: Data refresh

on:
  schedule:
    - cron: "0 2 3 * *"   # 02:00 UTC on the 3rd of every month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "scripts/**"
      - "_targets.R"
      - "config.yml"
      - "DESCRIPTION"
      - ".github/workflows/data-refresh.yml"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  pipeline:
    name: Rebuild data (latest OSM)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: any::renv
      - name: Run the targets pipeline from scratch
        run: Rscript -e 'targets::tar_make()'
      - name: Package the data release
        id: pkg
        run: |
          echo "tag=data-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          tar -czf atlas-data.tar.gz data-processed dashboard/data
          ls -lh atlas-data.tar.gz data-processed
      - name: Publish GitHub release
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          MD5=$(jq -r '.osm_md5 // "unknown"' dashboard/data/site-summary.json)
          NOTES="Automated build of the Iran Health Accessibility Atlas. OpenStreetMap extract md5: ${MD5}. QA results: data-quality-report.html. Licences: OSM-derived data ODbL 1.0; WorldPop and geoBoundaries CC BY 4.0."
          ASSETS="atlas-data.tar.gz data-processed/*.parquet data-processed/*.csv data-processed/*.csv.gz data-processed/data-quality-report.html"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS --title "Atlas data $TAG" --notes "$NOTES" --latest
          fi
      - name: Record exact package versions in renv.lock
        run: |
          Rscript -e 'renv::snapshot(library = .libPaths(), prompt = FALSE, force = TRUE)'
          if ! git diff --quiet -- renv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add renv.lock
            git commit -m "chore: refresh renv.lock from data build [skip ci]"
            git push
          fi
      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: data-processed/data-quality-report.html
          if-no-files-found: ignore

  deploy:
    needs: pipeline
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
