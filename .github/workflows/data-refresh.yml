name: Data refresh

on:
  schedule:
    - cron: "0 2 3 * *"   # 02:00 UTC on the 3rd of every month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "scripts/**"
      - "_targets.R"
      - "config.yml"
      - "DESCRIPTION"
      - ".github/workflows/data-refresh.yml"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  pipeline:
    name: Rebuild data (latest OSM)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: any::renv
      - name: Restore targets and downloaded inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            _targets
            data-raw
            data-intermediate
            data-processed
            dashboard/data
          key: atlas-${{ runner.os }}-v1-${{ hashFiles('DESCRIPTION', 'renv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            atlas-${{ runner.os }}-v1-${{ hashFiles('DESCRIPTION', 'renv.lock') }}-
      - name: Prepare inputs and checkpoint before national routing
        run: |
          Rscript -e 'targets::tar_make(names = c(population_grid_file, hospitals_file, road_graph_file, zonal, source_metadata), reporter = "verbose")'
      - name: Save pre-routing checkpoint
        uses: actions/cache/save@v4
        with:
          path: |
            _targets
            data-raw
            data-intermediate
            data-processed
            dashboard/data
          key: atlas-${{ runner.os }}-v1-${{ hashFiles('DESCRIPTION', 'renv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
      - name: Run remaining targets with resource diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          (
            while true; do
              date -u
              free -m
              df -h /
              ps -eo pid,ppid,rss,%cpu,comm --sort=-rss | head -n 12 || true
              sleep 60
            done
          ) > diagnostics/resources.log 2>&1 &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT
          /usr/bin/time -v Rscript -e 'targets::tar_make(reporter = "verbose")' 2>&1 | tee diagnostics/pipeline.log
      - name: Save completed targets
        uses: actions/cache/save@v4
        with:
          path: |
            _targets
            data-raw
            data-intermediate
            data-processed
            dashboard/data
          key: atlas-${{ runner.os }}-v1-${{ hashFiles('DESCRIPTION', 'renv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}-complete
      - name: Package the data release
        id: pkg
        run: |
          echo "tag=data-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          tar -czf atlas-data.tar.gz data-processed dashboard/data
          ls -lh atlas-data.tar.gz data-processed
      - name: Publish GitHub release
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          MD5=$(jq -r '.osm_md5 // "unknown"' dashboard/data/site-summary.json)
          NOTES="Automated build of the Iran Health Accessibility Atlas. OpenStreetMap extract md5: ${MD5}. QA results: data-quality-report.html. Licences: OSM-derived data ODbL 1.0; WorldPop and geoBoundaries CC BY 4.0."
          ASSETS="atlas-data.tar.gz data-processed/*.parquet data-processed/*.csv data-processed/*.csv.gz data-processed/data-quality-report.html"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS --title "Atlas data $TAG" --notes "$NOTES" --latest
          fi
      - name: Record exact package versions in renv.lock
        run: |
          Rscript -e 'renv::snapshot(library = .libPaths(), prompt = FALSE, force = TRUE)'
          if ! git diff --quiet -- renv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add renv.lock
            git commit -m "chore: refresh renv.lock from data build [skip ci]"
            git push
          fi
      - name: Upload diagnostics and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          path: |
            diagnostics/
            data-processed/data-quality-report.html
            _targets/meta/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: pipeline
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
