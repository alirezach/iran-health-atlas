name: Deploy website

on:
  push:
    branches: [main]
    paths-ignore:
      - "R/**"
      - "scripts/**"
      - "_targets.R"
      - "config.yml"
      - "renv.lock"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
      - name: Fetch the latest published data release
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern atlas-data.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/atlas-data.tar.gz"
            echo "Restored data from the latest release."
          else
            echo "::warning::No data release yet. The site renders with placeholders until the Data refresh workflow publishes one."
          fi
      - name: Render Quarto site
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
